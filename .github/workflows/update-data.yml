name: Update data from sources

# Checks Orphadata, HGNC, WikiPathways and HPO for new releases on the first day of each month.
# A change of version.txt starts the release and the website rebuild workflows.
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Write a new version also when nothing is changed"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - data/input/**
      - scripts/**

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A personal access token is necessary: a push with GITHUB_TOKEN does not start other workflows
      - name: Checkout cnv-data
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CNV_RELEASE_AUTOMATION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update datasets
        run: python scripts/update_datasets.py ${{ inputs.force && '--force' || '' }}

      - name: Commit and push new data version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data version.txt .zenodo.json
          git diff --cached --quiet && exit 0
          git commit -m "Update data $(cat version.txt)"
          git push origin HEAD:main
